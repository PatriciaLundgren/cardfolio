<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F0B14">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cardfolio">
  <meta name="robots" content="noindex, nofollow">
  <title>Cardfolio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Lock -->
  <section id="lock" class="lock" hidden>
    <div class="lock-inner">
      <img class="app-icon app-icon--small" src="logo.svg" alt="" aria-hidden="true">
      <p id="lock-msg" class="lock-msg">Enter your PIN</p>
      <div class="pin-dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
      <div class="keypad" id="keypad"></div>
    </div>
  </section>

  <!-- Home -->
  <main id="home" hidden>
    <header class="appbar">
      <div class="brand"><img class="brand-mark" src="mark.svg" alt="" aria-hidden="true"><h1 class="large-title">Cardfolio</h1></div>
      <div class="appbar-actions">
        <button class="icon-btn" id="open-settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="icon-btn icon-btn--primary" id="open-new" aria-label="Add card">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>
    <div class="search" id="search-wrap" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search cards">
    </div>
    <div id="stack" class="stack"></div>
    <div id="empty" class="empty" hidden>
      <img class="app-icon" src="logo.svg" alt="" aria-hidden="true">
      <h2>Add your first card</h2>
      <p>Screenshot your member card in the store’s app. We’ll pick up the logo, colors and barcode for you.</p>
      <button class="btn btn--primary btn--block" id="empty-new">Add a card</button>
    </div>
  </main>

  <dialog id="sheet-new" class="sheet"></dialog>
  <dialog id="sheet-stores" class="sheet"></dialog>
  <dialog id="sheet-crop" class="sheet sheet--dark"></dialog>
  <dialog id="sheet-editor" class="sheet"></dialog>
  <dialog id="sheet-detail" class="sheet"></dialog>
  <dialog id="sheet-camera" class="sheet sheet--dark"></dialog>
  <dialog id="sheet-settings" class="sheet"></dialog>
  <dialog id="sheet-wallet" class="sheet"></dialog>
  <dialog id="sheet-logos" class="sheet"></dialog>
  <dialog id="sheet-share" class="sheet"></dialog>

  <input type="file" id="pick-image" accept="image/*" hidden>
  <input type="file" id="pick-file" hidden>
  <div id="scan-file" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bwip-js@4.11.4/dist/bwip-js-min.js"></script>
  <script src="templates.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
